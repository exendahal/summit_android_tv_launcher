name: Wallpapers check

on:
  pull_request:
    paths: ['wallpapers/**', '.github/scripts/check_wallpapers.py', 'app/src/main/res/xml/locales_config.xml']

permissions:
  contents: read

jobs:
  check:
    name: Validate wallpapers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python .github/scripts/check_wallpapers.py
