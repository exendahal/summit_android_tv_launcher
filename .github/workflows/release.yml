name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build and test
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew assembleProdDataRelease bundleProdDataPlay testFakeDataDebugUnitTest

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/prodData/release/app-prodData-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "summit-$GITHUB_REF_NAME.apk"
          # Google Play takes the bundle (upload key = this keystore when Play App Signing is on).
          cp app/build/outputs/bundle/prodDataPlay/app-prodData-play.aab "summit-$GITHUB_REF_NAME.aab"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v1.0.0-beta.1) are published as pre-releases.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "summit-$GITHUB_REF_NAME.apk" "summit-$GITHUB_REF_NAME.aab" \
            --title "Summit $GITHUB_REF_NAME" --generate-notes $PRERELEASE

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
