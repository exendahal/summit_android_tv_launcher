plugins { id 'com.android.application' }

android {
    namespace 'np.exendahal.summitlauncher'
    compileSdk 34

    defaultConfig {
        // Sports scores need a licensed data API (PRD open question 1); hidden everywhere until one exists.
        buildConfigField 'boolean', 'SCORES_ENABLED', 'false'
        applicationId 'np.exendahal.summitlauncher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // PRD §17: fakeData = demo data from Appendix B, prodData = live Open-Meteo weather.
    flavorDimensions 'data'
    productFlavors {
        fakeData { dimension 'data'; buildConfigField 'boolean', 'FAKE_DATA', 'true' }
        prodData { dimension 'data'; buildConfigField 'boolean', 'FAKE_DATA', 'false' }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideload builds use the debug key; replace with a real keystore for Play (see README).
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
