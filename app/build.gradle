plugins { id 'com.android.application' }

android {
    namespace 'np.exendahal.summitlauncher'
    compileSdk 34

    defaultConfig {
        // Sports scores need a licensed data API (PRD open question 1); hidden everywhere until one exists.
        buildConfigField 'boolean', 'SCORES_ENABLED', 'false'
        buildConfigField 'boolean', 'PLAY', 'false'
        applicationId 'np.exendahal.summitlauncher'
        minSdk 26
        targetSdk 34
        // The release workflow sets these from the tag (v1.2.0 -> 1.2.0) and the run number.
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.1'
    }

    signingConfigs {
        release {
            // Provided by the release workflow from the ANDROID_* repository secrets.
            def keystore = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    // PRD §17: fakeData = demo data from Appendix B, prodData = live Open-Meteo weather.
    flavorDimensions 'data'
    productFlavors {
        fakeData { dimension 'data'; buildConfigField 'boolean', 'FAKE_DATA', 'true' }
        prodData { dimension 'data'; buildConfigField 'boolean', 'FAKE_DATA', 'false' }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the release key in CI; local builds use the debug key so they can still be sideloaded.
            signingConfig System.getenv('ANDROID_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
        // Google Play build (bundleProdDataPlay): no photo permission, and updates are checked on Play instead of GitHub.
        play {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'PLAY', 'true'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Play build only asks Play for updates; R8 drops it from the GitHub build (BuildConfig.PLAY is constant).
    implementation 'com.google.android.play:app-update:2.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
